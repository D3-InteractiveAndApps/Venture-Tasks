name: Supabase keep-alive

# Supabase pauses free projects that get too little database activity over a week.
# Read-only pings twice a week were not enough for ArcWright, so this calls
# venturetasks_ping() every 4 hours, which writes a timestamp to the database
# (see heartbeat.sql). A failed run emails you through GitHub.
on:
  schedule:
    - cron: '37 */4 * * *'    # every 4 hours, every day
  workflow_dispatch:          # adds a "Run workflow" button for testing

permissions:
  actions: write              # lets the last step keep this schedule switched on

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a heartbeat to Supabase
        env:
          SUPABASE_URL: https://sfxafzhyxoimuabitkjh.supabase.co
          SUPABASE_KEY: sb_publishable_nwgdhPF-ZRvghmIfb2rtuA_4Je_fxPk
        run: |
          code=$(curl -s -o beat.txt -w '%{http_code}' --retry 3 --retry-delay 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/venturetasks_ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code, heartbeat written at: $(cat beat.txt)"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase did not accept the heartbeat (HTTP $code). If the project is paused, restore it on the Supabase dashboard. If this says 404, run heartbeat.sql in the SQL Editor."
            exit 1
          fi

      - name: Keep this schedule switched on
        # GitHub turns off scheduled workflows in repos with no commits for 60 days.
        # Re-enabling the workflow each run resets that clock.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
